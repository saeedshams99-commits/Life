name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        run: |
          if [ ! -f life.keystore ]; then
            keytool -genkeypair -keystore life.keystore -storetype PKCS12 -storepass android -keypass android -alias lifekey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Saeed, O=LifeOS, C=IR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add life.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/saeed/life app/src/main/assets
          cp life.keystore app/life.keystore
          cd app
          cat > settings.gradle <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LifeOS"
          EOF_X
          cat > build.gradle <<'EOF_X'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'com.saeed.life'
              compileSdk 34
              signingConfigs {
                  fixed {
                      storeFile file('life.keystore')
                      storePassword 'android'
                      keyAlias 'lifekey'
                      keyPassword 'android'
                  }
              }
              defaultConfig {
                  applicationId 'com.saeed.life'
                  minSdk 21
                  targetSdk 34
                  versionCode __BUILD__
                  versionName '__BUILD__'
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_X
          cat > src/main/AndroidManifest.xml <<'EOF_X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <application android:label="&#x632;&#x646;&#x62f;&#x6af;&#x6cc; &#x645;&#x646;" android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_X
          cat > src/main/java/com/saeed/life/MainActivity.java <<'EOF_X'
          package com.saeed.life;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Iterator;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView web;
              SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("life", MODE_PRIVATE);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setBackgroundColor(0xFF0B1A2E);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web == null) { finish(); return; }
                  web.evaluateJavascript("(window.appBack && appBack()) ? 1 : 0", new android.webkit.ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String v) { if (v == null || !v.contains("1")) finish(); }
                  });
              }
              @Override
              protected void onPause() {
                  super.onPause();
                  if (web != null) { web.onPause(); web.pauseTimers(); }
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) { web.resumeTimers(); web.onResume(); }
              }

              synchronized void alStore(String id, long t, String title, String text) {
                  try {
                      JSONObject o = new JSONObject(prefs.getString("__al", "{}"));
                      if (t > 0) {
                          JSONObject a = new JSONObject();
                          a.put("t", t);
                          a.put("ti", title);
                          a.put("tx", text);
                          o.put(id, a);
                      } else {
                          o.remove(id);
                      }
                      long now = System.currentTimeMillis();
                      ArrayList<String> old = new ArrayList<String>();
                      Iterator<String> it = o.keys();
                      while (it.hasNext()) {
                          String k = it.next();
                          JSONObject a = o.optJSONObject(k);
                          if (a == null || a.optLong("t", 0) < now) old.add(k);
                      }
                      for (String k : old) o.remove(k);
                      prefs.edit().putString("__al", o.toString()).apply();
                  } catch (Exception e) {
                  }
              }

              static String read(InputStream in) throws Exception {
                  if (in == null) return "";
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  in.close();
                  return new String(out.toByteArray(), "UTF-8");
              }

              class Bridge {
                  @JavascriptInterface
                  public String load(String k) {
                      return prefs.getString(k, "");
                  }

                  @JavascriptInterface
                  public void save(String k, String v) {
                      prefs.edit().putString(k, v).apply();
                  }

                  @JavascriptInterface
                  public void alarm(String id, String when, String title, String text) {
                      try {
                          long t = Long.parseLong(when);
                          if (t < System.currentTimeMillis()) return;
                          AlarmReceiver.set(MainActivity.this, id, t, title, text);
                          alStore(id, t, title, text);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void cancelAlarm(String id) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                          am.cancel(AlarmReceiver.pi(MainActivity.this, id, "", ""));
                          alStore(id, 0, "", "");
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void share(final String t) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(Intent.ACTION_SEND);
                                  i.setType("text/plain");
                                  i.putExtra(Intent.EXTRA_SUBJECT, "Life backup");
                                  i.putExtra(Intent.EXTRA_TEXT, t);
                                  Intent ch = Intent.createChooser(i, "Backup");
                                  startActivity(ch);
                              } catch (Exception e) {
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void setClip(final String t) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  android.content.ClipboardManager cm = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                                  if (cm != null) cm.setPrimaryClip(android.content.ClipData.newPlainText("life", t));
                              } catch (Exception e) {
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public String clip() {
                      try {
                          android.content.ClipboardManager cm = (android.content.ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                          if (cm == null || !cm.hasPrimaryClip()) return "";
                          android.content.ClipData d = cm.getPrimaryClip();
                          if (d == null || d.getItemCount() == 0) return "";
                          CharSequence t = d.getItemAt(0).coerceToText(MainActivity.this);
                          return t == null ? "" : t.toString();
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void openUrl(String url) {
                      try {
                          Intent i = new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(url));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(i);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void get(final String url, final String cb) {
                      new Thread(new Runnable() {
                          public void run() {
                              JSONObject r = new JSONObject();
                              try {
                                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                                  c.setConnectTimeout(15000);
                                  c.setReadTimeout(25000);
                                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36");
                                  c.setRequestProperty("Accept", "application/json");
                                  int code = c.getResponseCode();
                                  InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                                  r.put("status", code);
                                  r.put("body", read(in));
                              } catch (Exception e) {
                                  try {
                                      r.put("status", 0);
                                      r.put("body", String.valueOf(e.getMessage()));
                                  } catch (Exception ignored) {
                                  }
                              }
                              final String js = "window.__cb(" + JSONObject.quote(cb) + "," + JSONObject.quote(r.toString()) + ")";
                              runOnUiThread(new Runnable() {
                                  public void run() {
                                      web.evaluateJavascript(js, null);
                                  }
                              });
                          }
                      }).start();
                  }
              }
          }
          EOF_X
          cat > src/main/java/com/saeed/life/AlarmReceiver.java <<'EOF_X'
          package com.saeed.life;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AlarmReceiver extends BroadcastReceiver {
              static PendingIntent pi(Context c, String id, String title, String text) {
                  Intent i = new Intent(c, AlarmReceiver.class);
                  i.putExtra("title", title);
                  i.putExtra("text", text);
                  i.putExtra("nid", id.hashCode());
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) fl |= PendingIntent.FLAG_IMMUTABLE;
                  return PendingIntent.getBroadcast(c, id.hashCode(), i, fl);
              }

              static void set(Context c, String id, long t, String title, String text) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  PendingIntent p = pi(c, id, title, text);
                  boolean exact = true;
                  if (Build.VERSION.SDK_INT >= 31) {
                      try { exact = am.canScheduleExactAlarms(); } catch (Exception e) { exact = false; }
                  }
                  try {
                      if (Build.VERSION.SDK_INT >= 23) {
                          if (exact) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                          else am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, t, p);
                      }
                  } catch (Exception e) {
                      try {
                          if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                          else am.set(AlarmManager.RTC_WAKEUP, t, p);
                      } catch (Exception e2) {
                      }
                  }
              }

              @Override
              public void onReceive(Context ctx, Intent in) {
                  String title = in.getStringExtra("title");
                  String text = in.getStringExtra("text");
                  int nid = in.getIntExtra("nid", 1);
                  NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  Notification.Builder b;
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel("alarms", "\u0622\u0644\u0627\u0631\u0645\u200c\u0647\u0627 \u0648 \u06cc\u0627\u062f\u0622\u0648\u0631\u0647\u0627", NotificationManager.IMPORTANCE_HIGH);
                      ch.enableVibration(true);
                      nm.createNotificationChannel(ch);
                      b = new Notification.Builder(ctx, "alarms");
                  } else {
                      b = new Notification.Builder(ctx);
                      b.setPriority(Notification.PRIORITY_HIGH);
                      b.setDefaults(Notification.DEFAULT_ALL);
                  }
                  Intent open = new Intent(ctx, MainActivity.class);
                  int fl = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) fl |= PendingIntent.FLAG_IMMUTABLE;
                  PendingIntent p = PendingIntent.getActivity(ctx, nid, open, fl);
                  b.setSmallIcon(android.R.drawable.ic_popup_reminder);
                  b.setContentTitle(title);
                  b.setContentText(text);
                  b.setStyle(new Notification.BigTextStyle().bigText(text));
                  b.setAutoCancel(true);
                  b.setContentIntent(p);
                  nm.notify(nid, b.build());
              }
          }
          EOF_X
          cat > src/main/java/com/saeed/life/BootReceiver.java <<'EOF_X'
          package com.saeed.life;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import java.util.Iterator;
          import org.json.JSONObject;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent in) {
                  try {
                      SharedPreferences p = c.getSharedPreferences("life", Context.MODE_PRIVATE);
                      JSONObject o = new JSONObject(p.getString("__al", "{}"));
                      long now = System.currentTimeMillis();
                      Iterator<String> it = o.keys();
                      while (it.hasNext()) {
                          String id = it.next();
                          JSONObject a = o.optJSONObject(id);
                          if (a == null) continue;
                          long t = a.optLong("t", 0);
                          if (t > now) AlarmReceiver.set(c, id, t, a.optString("ti", ""), a.optString("tx", ""));
                      }
                  } catch (Exception e) {
                  }
              }
          }
          EOF_X
