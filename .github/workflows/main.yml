                      if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createWaveform(pat, 0));
                      else vib.vibrate(pat, 0);
                  } catch (Exception e) {
                  }
              }

              int defSnooze() {
                  try {
                      String v = getSharedPreferences("life", Context.MODE_PRIVATE).getString("__snz", "10");
                      int m = Integer.parseInt(v.replaceAll("[^0-9]", ""));
                      return m > 0 ? m : 10;
