                  String act = in.getAction();
                  if ("DISMISS".equals(act)) { ringing = false; stopAll(); return START_NOT_STICKY; }
                  if ("SNOOZE".equals(act)) { if (ringing) snooze(in.getIntExtra("min", 0)); ringing = false; stopAll(); return START_NOT_STICKY; }
                  if (ringing) { snooze(0); release(); }
                  h.removeCallbacks(timeout);
                  h.removeCallbacks(again);
                  id = str(in.getStringExtra("id"));
                  title = str(in.getStringExtra("title"));
                  text = str(in.getStringExtra("text"));
                  voice = str(in.getStringExtra("voice"));
                  rep = in.getIntExtra("rep", 0);
