                  if (am == null) return;
                  PendingIntent p = pi(c, id, title, text);
                  try {
                      if (!exactOk(am)) fallback(am, t, p);
                      else if (Build.VERSION.SDK_INT >= 23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                      else am.setExact(AlarmManager.RTC_WAKEUP, t, p);
