name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Signing key
        run: |
          if [ ! -f life.keystore ]; then
            keytool -genkeypair -keystore life.keystore -storetype PKCS12 -storepass android -keypass android -alias lifekey -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Saeed, O=LifeOS, C=IR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add life.keystore
            git commit -m "Add signing key"
            git push
          fi

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/saeed/life app/src/main/assets
          cp life.keystore app/life.keystore
          cd app
          cat > settings.gradle <<'EOF_X'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "LifeOS"
          EOF_X
          cat > build.gradle <<'EOF_X'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'com.saeed.life'
              compileSdk 34
              signingConfigs {
                  fixed {
                      storeFile file('life.keystore')
                      storePassword 'android'
                      keyAlias 'lifekey'
                      keyPassword 'android'
                  }
              }
              defaultConfig {
                  applicationId 'com.saeed.life'
                  minSdk 21
                  targetSdk 34
                  versionCode __BUILD__
                  versionName '__BUILD__'
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_X
          cat > src/main/AndroidManifest.xml <<'EOF_X'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.GET_CONTENT" />
                      <data android:mimeType="image/*" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>
              <application android:label="&#x632;&#x646;&#x62f;&#x6af;&#x6cc; &#x645;&#x646;" android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize" android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale|locale|layoutDirection">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".RingActivity" android:exported="false" android:launchMode="singleTop"
                      android:excludeFromRecents="true" android:taskAffinity="com.saeed.life.ring" />
                  <service android:name=".RingService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
                  <provider android:name=".PhotoProvider" android:authorities="com.saeed.life.photos" android:exported="false" android:grantUriPermissions="true" />
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF_X
          cat > src/main/java/com/saeed/life/MainActivity.java <<'EOF_X'
          package com.saeed.life;

          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.NotificationManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.media.ExifInterface;
          import android.net.Uri;
          import android.provider.MediaStore;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.media.MediaPlayer;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              WebView web;
              SharedPreferences prefs;
              MediaRecorder rec;
              String recId = "";
              long recT0 = 0;
              MediaPlayer pl;
              String pickCb = "";
              String imgCb = "";
              String imgId = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  prefs = getSharedPreferences("life", MODE_PRIVATE);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  web.setBackgroundColor(0xFF0B1A2E);
                  web.addJavascriptInterface(new Bridge(), "Android");
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web == null) { finish(); return; }
                  web.evaluateJavascript("(window.appBack && appBack()) ? 1 : 0", new android.webkit.ValueCallback<String>() {
                      @Override
                      public void onReceiveValue(String v) { if (v == null || !v.contains("1")) finish(); }
                  });
              }
              @Override
              protected void onPause() {
                  if (web != null) web.evaluateJavascript("window.draftSave && draftSave()", null);
                  super.onPause();
                  if (web != null) { web.onPause(); web.pauseTimers(); }
              }
              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) { web.resumeTimers(); web.onResume(); web.evaluateJavascript("window.onResumeApp && onResumeApp()", null); }
              }

              @Override
              protected void onActivityResult(int rq, int rs, Intent data) {
                  super.onActivityResult(rq, rs, data);
                  if (rq == 8 || rq == 9) { imgResult(rq, rs, data); return; }
                  if (rq != 7) return;
                  JSONObject r = new JSONObject();
                  try {
                      if (rs == RESULT_OK && data != null && data.getData() != null) {
                          Cursor c = getContentResolver().query(data.getData(),
                                  new String[]{ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, ContactsContract.CommonDataKinds.Phone.NUMBER}, null, null, null);
                          if (c != null) {
                              if (c.moveToFirst()) {
                                  r.put("n", String.valueOf(c.getString(0)));
                                  r.put("ph", String.valueOf(c.getString(1)));
                              }
                              c.close();
                          }
                      }
                  } catch (Exception e) {
                  }
                  jsCb(pickCb, r.toString());
              }

              File camFile() {
                  return new File(getCacheDir(), "cam_" + sid(imgId) + ".jpg");
              }

              File imgFile(String id) {
                  File d = new File(getFilesDir(), "img");
                  d.mkdirs();
                  return new File(d, sid(id) + ".jpg");
              }

              void imgResult(final int rq, int rs, final Intent data) {
                  if (imgId == null || imgId.length() == 0) imgId = prefs.getString("__imgid", "");
                  final String cb = imgCb, id = imgId;
                  if (rs != RESULT_OK) { jsCb(cb, "{\"ok\":0}"); return; }
                  new Thread(new Runnable() {
                      public void run() {
                          boolean ok = false;
                          File tmp = null;
                          try {
                              if (rq == 8) {
                                  tmp = camFile();
                              } else if (data != null && data.getData() != null) {
                                  tmp = new File(getCacheDir(), "gal_" + sid(id) + ".tmp");
                                  InputStream in = getContentResolver().openInputStream(data.getData());
                                  OutputStream out = new FileOutputStream(tmp);
                                  byte[] buf = new byte[16384];
                                  int n;
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                                  in.close();
                                  out.close();
                              }
                              if (tmp != null && tmp.exists() && tmp.length() > 0) ok = shrink(tmp, imgFile(id));
                              if (ok) prefs.edit().putString("__imgp", id).apply();
                          } catch (Exception e) {
                              ok = false;
                          }
                          try { if (tmp != null) tmp.delete(); } catch (Exception e) { }
                          jsCb(cb, ok ? "{\"ok\":1}" : "{\"ok\":0}");
                      }
                  }).start();
              }

              static boolean shrink(File src, File dst) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      BitmapFactory.decodeFile(src.getAbsolutePath(), o);
                      int mx = Math.max(o.outWidth, o.outHeight), ss = 1;
                      if (mx <= 0) return false;
                      while (mx / (ss * 2) >= 1800) ss *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = ss;
                      Bitmap b = BitmapFactory.decodeFile(src.getAbsolutePath(), o2);
                      if (b == null) return false;
                      int rot = 0;
                      try {
                          ExifInterface e = new ExifInterface(src.getAbsolutePath());
                          int or = e.getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                          if (or == ExifInterface.ORIENTATION_ROTATE_90) rot = 90;
                          else if (or == ExifInterface.ORIENTATION_ROTATE_180) rot = 180;
                          else if (or == ExifInterface.ORIENTATION_ROTATE_270) rot = 270;
                      } catch (Exception e) {
                      }
                      float sc = Math.min(1f, 1800f / Math.max(b.getWidth(), b.getHeight()));
                      Bitmap out = b;
                      if (sc < 1f || rot != 0) {
                          Matrix m = new Matrix();
                          if (sc < 1f) m.postScale(sc, sc);
                          if (rot != 0) m.postRotate(rot);
                          out = Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), m, true);
                      }
                      FileOutputStream fo = new FileOutputStream(dst);
                      out.compress(Bitmap.CompressFormat.JPEG, 82, fo);
                      fo.close();
                      return dst.length() > 0;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              void jsCb(String cb, String json) {
                  final String js = "window.__cb(" + JSONObject.quote(cb) + "," + JSONObject.quote(json) + ")";
                  runOnUiThread(new Runnable() {
                      public void run() {
                          if (web != null) web.evaluateJavascript(js, null);
                      }
                  });
              }

              void jsRun(final String js) {
                  runOnUiThread(new Runnable() {
                      public void run() {
                          if (web != null) web.evaluateJavascript(js, null);
                      }
                  });
              }

              static String sid(String id) {
                  return id == null ? "" : id.replaceAll("[^A-Za-z0-9_]", "");
              }

              File vfile(String id) {
                  return new File(getFilesDir(), "v_" + sid(id) + ".m4a");
              }

              synchronized long recStopInt() {
                  if (rec == null) return 0;
                  long ms = System.currentTimeMillis() - recT0;
                  try { rec.stop(); } catch (Exception e) { ms = 0; }
                  try { rec.release(); } catch (Exception e) { }
                  rec = null;
                  File tmp = new File(getFilesDir(), "v_" + recId + ".tmp.m4a");
                  File f = new File(getFilesDir(), "v_" + recId + ".m4a");
                  if (ms > 300 && tmp.exists()) {
                      f.delete();
                      tmp.renameTo(f);
                  } else {
                      tmp.delete();
                      ms = 0;
                  }
                  return Math.min(ms, 10000);
              }

              void stopPl() {
                  if (pl != null) {
                      try { pl.stop(); } catch (Exception e) { }
                      try { pl.release(); } catch (Exception e) { }
                      pl = null;
                  }
              }

              synchronized void alStore(String id, long t, String title, String text, String voice, boolean ring) {
                  try {
                      JSONObject o = new JSONObject(prefs.getString("__al", "{}"));
                      if (t > 0) {
                          JSONObject a = new JSONObject();
                          a.put("t", t);
                          a.put("ti", title);
                          a.put("tx", text);
                          a.put("v", voice == null ? "" : voice);
                          a.put("r", ring);
                          o.put(id, a);
                      } else {
                          o.remove(id);
                      }
                      long now = System.currentTimeMillis();
                      ArrayList<String> old = new ArrayList<String>();
                      Iterator<String> it = o.keys();
                      while (it.hasNext()) {
                          String k = it.next();
                          JSONObject a = o.optJSONObject(k);
                          if (a == null || a.optLong("t", 0) < now) old.add(k);
                      }
                      for (String k : old) o.remove(k);
                      prefs.edit().putString("__al", o.toString()).apply();
                  } catch (Exception e) {
                  }
              }

              static String read(InputStream in) throws Exception {
                  if (in == null) return "";
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  in.close();
                  return new String(out.toByteArray(), "UTF-8");
              }

              void startAct(Intent i) {
                  try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                  }
              }

              class Bridge {
                  @JavascriptInterface
                  public String load(String k) {
                      return prefs.getString(k, "");
                  }

                  @JavascriptInterface
                  public void save(String k, String v) {
                      prefs.edit().putString(k, v).apply();
                  }

                  @JavascriptInterface
                  public void alarm(String id, String when, String title, String text) {
                      try {
                          long t = Long.parseLong(when);
                          if (t < System.currentTimeMillis()) return;
                          AlarmReceiver.set(MainActivity.this, id, t, title, text);
                          alStore(id, t, title, text, "", false);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void ring(String id, String when, String title, String text, String voice) {
                      try {
                          long t = Long.parseLong(when);
                          if (t < System.currentTimeMillis()) return;
                          AlarmReceiver.setRing(MainActivity.this, id, t, title, text, voice, 0);
                          alStore(id, t, title, text, voice, true);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void cancelAlarm(String id) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                          am.cancel(AlarmReceiver.pi(MainActivity.this, id, "", ""));
                          am.cancel(AlarmReceiver.pi(MainActivity.this, id + "_z", "", ""));
                          alStore(id, 0, "", "", "", false);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public String recStart(String id) {
                      if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission("android.permission.RECORD_AUDIO") != PackageManager.PERMISSION_GRANTED) {
                          runOnUiThread(new Runnable() {
                              public void run() {
                                  requestPermissions(new String[]{"android.permission.RECORD_AUDIO"}, 2);
                              }
                          });
                          return "perm";
                      }
                      recStopInt();
                      stopPl();
                      try {
                          String s = sid(id);
                          File f = new File(getFilesDir(), "v_" + s + ".tmp.m4a");
                          MediaRecorder r = new MediaRecorder();
                          r.setAudioSource(MediaRecorder.AudioSource.MIC);
                          r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                          r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                          r.setAudioEncodingBitRate(96000);
                          r.setAudioSamplingRate(44100);
                          r.setMaxDuration(10000);
                          r.setOutputFile(f.getAbsolutePath());
                          r.setOnInfoListener(new MediaRecorder.OnInfoListener() {
                              public void onInfo(MediaRecorder mr, int what, int extra) {
                                  if (what == MediaRecorder.MEDIA_RECORDER_INFO_MAX_DURATION_REACHED) {
                                      long ms = recStopInt();
                                      jsRun("window.recDone && recDone(" + ms + ")");
                                  }
                              }
                          });
                          r.prepare();
                          r.start();
                          rec = r;
                          recId = s;
                          recT0 = System.currentTimeMillis();
                          return "ok";
                      } catch (Exception e) {
                          try { if (rec != null) rec.release(); } catch (Exception e2) { }
                          rec = null;
                          return "err";
                      }
                  }

                  @JavascriptInterface
                  public String recStop() {
                      return String.valueOf(recStopInt());
                  }

                  @JavascriptInterface
                  public void playVoice(String id) {
                      stopPl();
                      try {
                          File f = vfile(id);
                          if (!f.exists()) return;
                          MediaPlayer p = new MediaPlayer();
                          p.setDataSource(f.getAbsolutePath());
                          p.prepare();
                          p.start();
                          pl = p;
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void stopVoice() {
                      stopPl();
                  }

                  @JavascriptInterface
                  public String hasVoice(String id) {
                      return vfile(id).exists() ? "1" : "0";
                  }

                  @JavascriptInterface
                  public void delVoice(String id) {
                      try { vfile(id).delete(); } catch (Exception e) { }
                  }

                  @JavascriptInterface
                  public void pickContact(String cb) {
                      pickCb = cb;
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI);
                                  startActivityForResult(i, 7);
                              } catch (Exception e) {
                                  jsCb(pickCb, "{}");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void imgCam(final String id, final String cb) {
                      imgId = id;
                      prefs.edit().putString("__imgid", id).apply();
                      imgCb = cb;
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  File f = camFile();
                                  f.delete();
                                  Uri u = Uri.parse("content://" + PhotoProvider.AUTH + "/" + f.getName());
                                  Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  i.putExtra(MediaStore.EXTRA_OUTPUT, u);
                                  i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  i.setClipData(android.content.ClipData.newRawUri("", u));
                                  startActivityForResult(i, 8);
                              } catch (Exception e) {
                                  jsCb(cb, "{\"ok\":0,\"err\":\"cam\"}");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void imgGal(final String id, final String cb) {
                      imgId = id;
                      prefs.edit().putString("__imgid", id).apply();
                      imgCb = cb;
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                                  i.setType("image/*");
                                  i.addCategory(Intent.CATEGORY_OPENABLE);
                                  startActivityForResult(Intent.createChooser(i, "Photo"), 9);
                              } catch (Exception e) {
                                  jsCb(cb, "{\"ok\":0,\"err\":\"gal\"}");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public String imgTake() {
                      String v = prefs.getString("__imgp", "");
                      prefs.edit().remove("__imgp").apply();
                      return v;
                  }

                  @JavascriptInterface
                  public String imgPath(String id) {
                      File f = imgFile(id);
                      return f.exists() ? "file://" + f.getAbsolutePath() : "";
                  }

                  @JavascriptInterface
                  public void imgDel(String id) {
                      try { imgFile(id).delete(); } catch (Exception e) { }
                  }

                  @JavascriptInterface
                  public void imgView(String id) {
                      try {
                          Uri u = Uri.parse("content://" + PhotoProvider.AUTH + "/" + sid(id) + ".jpg");
                          Intent i = new Intent(Intent.ACTION_VIEW);
                          i.setDataAndType(u, "image/jpeg");
                          i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          startAct(i);
                      } catch (Exception e) {
                      }
                  }

                  @JavascriptInterface
                  public void dial(String num) {
                      startAct(new Intent(Intent.ACTION_DIAL, android.net.Uri.parse("tel:" + num)));
                  }

                  @JavascriptInterface
                  public String openApp(String pkg, String url) {
                      try {
                          if (pkg != null && pkg.length() > 0) {
                              Intent i = getPackageManager().getLaunchIntentForPackage(pkg);
                              if (i != null) { startAct(i); return "app"; }
                          }
                          if (url != null && url.length() > 0) {
                              startAct(new Intent(Intent.ACTION_VIEW, android.net.Uri.parse(url)));
                              return "web";
                          }
                      } catch (Exception e) {
                      }
                      return "";
                  }

                  @JavascriptInterface
                  public String apps() {
                      JSONArray a = new JSONArray();
                      try {
                          PackageManager pm = getPackageManager();
                          Intent m = new Intent(Intent.ACTION_MAIN);
                          m.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> l = pm.queryIntentActivities(m, 0);
                          for (ResolveInfo ri : l) {
                              JSONObject o = new JSONObject();
                              o.put("n", String.valueOf(ri.loadLabel(pm)));
                              o.put("p", ri.activityInfo.packageName);
                              a.put(o);
                          }
                      } catch (Exception e) {
                      }
                      return a.toString();
                  }

                  @JavascriptInterface
                  public String perms() {
                      JSONObject o = new JSONObject();
                      try {
                          boolean fs = true, ex = true, mic = true, nt = true;
                          if (Build.VERSION.SDK_INT >= 34) {
                              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                              fs = nm.canUseFullScreenIntent();
                          }
                          if (Build.VERSION.SDK_INT >= 31) {
                              AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                              ex = am.canScheduleExactAlarms();
                          }
                          if (Build.VERSION.SDK_INT >= 23) mic = checkSelfPermission("android.permission.RECORD_AUDIO") == PackageManager.PERMISSION_GRANTED;
                          if (Build.VERSION.SDK_INT >= 33) nt = checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED;
                          o.put("fs", fs);
                          o.put("ex", ex);
                          o.put("mic", mic);
                          o.put("nt", nt);
                      } catch (Exception e) {
                      }
                      return o.toString();
                  }

                  @JavascriptInterface
