                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  PendingIntent p = pi(c, id, title, text, voice, true, rep);
                  try {
                      if (!exactOk(am)) { fallback(am, t, p); return; }
                      Intent show = new Intent(c, MainActivity.class);
